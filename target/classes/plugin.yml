name: CommandsAndGUI
version: '1.0.1'
main: me.richter.commandsAndGUI.Main
api-version: '1.13'

commands:
  backpack:
    description: create, share, and use double chest sized backpacks
    usage: digga schau halt ma die tab vorschläge an (viel zu faul die ganzen möglichkeiten hier hin zu schallern)
    aliases: []
    permission: commandsAndGUI.command.backpack
    permission-message: You do not have permission to use this command (you need the commandsAndGUI.command.backpack permission)

  fly:
    description: allows you to fly or change the fly speed
    usage: /<command> [speed/on/off] [speed 0-10]
    aliases: []
    permission: commandsAndGUI.command.fly
    permission-message: You do not have permission to use this command (you need the commandsAndGUI.command.fly permission)

  god:
    description: makes you invincible
    usage: /<command> [playerName]
    aliases: []
    permission: commandsAndGUI.command.god
    permission-message: You do not have permission to use this command (you need the commandsAndGUI.command.god permission)

  gui:
    description: opens the GUI of CommandAndGUI
    usage: /<command>
    aliases: []
    permission: commandsAndGUI.command.gui
    permission-message: You do not have permission to use this command (you need the commandsAndGUI.command.gui permission)


  heal:
    description: heal a player
    usage: /<command> [playerName]
    aliases: []
    permission: commandsAndGUI.command.heal
    permission-message: You do not have permission to use this command (you need the commandsAndGUI.command.heal permission)

  jump:
    description: make a player jump high
    usage: /<command> [playerName]
    aliases: []
    permission: commandsAndGUI.command.jump
    permission-message: You do not have permission to use this command (you need the commandsAndGUI.command.jump permission)

  setup:
    description: Executes the Setup Commands
    usage: /<command>
    aliases: []
    permission: commandsAndGUI.command.setup
    permission-message: You do not have permission to use this command (you need the commandsAndGUI.command.setup permission)


