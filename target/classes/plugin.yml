    permission: commandsAndGUI.command.sit
    permission-message: You do not have permission to use this command (you need the commandsAndGUI.command.sit permission)


  vanish:
    description: makes you invisible to other players
    usage: /<command> [fakeDisconnect]
    aliases: []
    permission: commandsAndGUI.command.vanish
    permission-message: You do not have permission to use this command (you need the commandsAndGUI.command.vanish permission)

  workstation:
    description: opens a workstation like the crafting menu
    usage: /<command> [workstation]
